<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOC | BrickV3rse</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <!-- PAGE HEADER -->


    <!-- ===== MAIN (même structure que witches-road.html) ===== -->
    <div class="main-content project-page">
        <div class="title">
            <h1 id="page-title">Titre</h1>
        </div>

        <div class="separator"></div>

        <!-- HERO: image principale + encart références -->
        <section class="project-hero" aria-label="Présentation du projet">
            <section class="project-gallery" aria-label="Galerie d'images">
                <div class="carousel" aria-roledescription="carrousel">
                    <button class="carousel-see-all" type="button">
                        <span data-key="see_all">Tout voir</span>
                    </button>
                    <div class="carousel-track" id="carouselTrack"></div>
                </div>

                <div class="thumbs" id="thumbs"></div>
            </section>

            <!-- ASIDE TABS -->
            <aside class="project-aside" aria-label="Infos & médias">

                <!-- panneaux (remplis dynamiquement selon la data) -->
                <!-- entête des onglets -->
                <div class="tabs" id="asideTabs" role="tablist" aria-label="Onglets détails"></div>
                <!-- Référence -->
                <section id="tab-ref" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-ref" hidden>
                    <h3 class="meta-title" data-key="tab_ref"></h3>
                    <div class="ref-image">
                        <img id="ref-img" alt="Image de référence">
                    </div>
                    <div class="meta-grid" id="meta-grid"></div>
                </section>

                <!-- 3D -->
                <section id="tab-3d" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-3d" hidden>
                    <div class="brick3d-viewer" id="brick3d-viewer" aria-label="Visualiseur 3D LEGO">
                        <div class="brick3d-canvas" id="brick3d-canvas"></div>
                        <div class="brick3d-message" id="brick3d-message" role="status">Chargement du modèle 3D...</div>
                        <div class="brick3d-toolbar">
                            <label class="brick3d-toggle">
                                <input type="checkbox" id="brick3d-outlines" checked>
                                <span>Contours noirs</span>
                            </label>
                            <button type="button" id="brick3d-reset" aria-label="Recentrer le modèle">Recentrer</button>
                        </div>
                    </div>
                </section>

                <!-- Vidéo -->
                <section id="tab-video" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-video" hidden>
                    <div class="video-wrapper">
                        <iframe id="video-iframe" src="" title="Vidéo" frameborder="0" allowfullscreen></iframe>
                    </div>
                </section>

                <!-- Notice -->
                <section id="tab-notice" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-notice" hidden>

                    <!-- 👇 Visualiseur PDF intégré -->
                    <div class="pdf-viewer" id="notice-viewer" hidden>
                        <iframe id="notice-iframe" title="Notice PDF" loading="lazy"></iframe>
                    </div>
                </section>
            </aside>

        </section>

        <!-- DESCRIPTION -->
        <section class="project-description">
            <h2>Description</h2>
            <p id="desc"></p>
        </section>
    </div>

    <!-- FOOTER -->


    <!-- SCRIPT -->
    <script src="js/data-detail.js"></script>
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>
    <script src="js/translations.js"></script>

    <!-- =========================================================
     SCRIPT PRINCIPAL — Hydratation contrôlée (un seul onglet visible)
     ========================================================= -->
    <script>
        (function () {
            // ----- [A] Utilitaires & contexte -----
            const $ = (s) => document.querySelector(s);
            const curLang = (window.currentLang || 'fr');

            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // ----- [B] Données -----
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);
            const p = PROJECTS.find(x => x.id === mocId) || {};
            const d = DETAILS.find(x => x.id === mocId) || {};
            const data = Object.assign({}, p, d);

            // ----- [C] Titre & description -----
            const title =
                (p.name && (p.name[curLang] || p.name.en || p.name.fr)) ||
                (d.title && (d.title[curLang] || d.title.en || d.title.fr)) ||
                (mocId || '');
            $('#page-title').textContent = title;

            const desc = (d.description && (d.description[curLang] || d.description.en || d.description.fr)) || '';
            $('#desc').textContent = desc;
            const descSection = $('.project-description');
            if (!desc.trim() && descSection) descSection.style.display = 'none';

            // ----- [D] Galerie / carrousel -----
            const gallery = (d.images && Array.isArray(d.images.gallery)) ? d.images.gallery : [];
            const track = $('#carouselTrack');
            const dots = $('#carouselDots');
            const thumbs = $('#thumbs');

            if (track) {
                track.innerHTML = gallery.map((g, i) => `
  <div class="carousel-slide">
    <img src="${g.src}" alt="${title} - ${g.caption || ''}" data-index="${i}" />
  </div>
`).join('');
            }
            if (thumbs) {
                thumbs.innerHTML = gallery.map((g, i) => `
        <button ${i === 0 ? 'class="active"' : ''} data-index="${i}">
          <img src="${g.src}" alt="Miniature ${i + 1}"/>
        </button>
      `).join('');
            }


            // ----- Dots (fenêtre + track animé) -----
            let dotsTrack = null;

            function mountDots() {
                if (!dots) return;

                // crée un track interne si pas déjà présent
                dotsTrack = dots.querySelector('.carousel-dots-track');
                if (!dotsTrack) {
                    dotsTrack = document.createElement('div');
                    dotsTrack.className = 'carousel-dots-track';
                    dots.appendChild(dotsTrack);
                }

                // génère les dots dans le track (avec data-index)
                dotsTrack.innerHTML = gallery.map((_, i) => `
    <button
      class="carousel-dot ${i === 0 ? 'active' : ''}"
      data-index="${i}"
      aria-label="Aller à l'image ${i + 1}"
      type="button"
    ></button>
  `).join('');
            }

            function updateDotsWindow() {
                if (!dots || !dotsTrack) return;

                const total = gallery.length;
                if (total <= 1) {
                    dots.style.display = 'none';
                    return;
                } else {
                    dots.style.display = '';
                }

                // visible depuis CSS (fallback 7)
                const visible = parseInt(getComputedStyle(dots).getPropertyValue('--dots-visible'), 10) || 7;
                const half = Math.floor(visible / 2);

                const firstDot = dotsTrack.querySelector('.carousel-dot');
                if (!firstDot) return;

                // step = largeur dot + gap (calcul robuste)
                const trackStyle = getComputedStyle(dotsTrack);
                const gap =
                    parseFloat(trackStyle.columnGap) ||
                    parseFloat(trackStyle.gap) ||
                    0;

                const step = firstDot.offsetWidth + gap;

                // offset "cible" pour que index soit au centre
                const rawOffset = (index - half) * step;

                // clamp pour éviter d'aller trop loin
                const maxOffset = Math.max(0, (total - visible) * step);
                const clamped = Math.max(0, Math.min(rawOffset, maxOffset));

                dotsTrack.style.transform = `translateX(${-clamped}px)`;
            }

            // click sur un dot => goTo(index)
            dots?.addEventListener('click', (e) => {
                const btn = e.target.closest('.carousel-dot');
                if (!btn || !dots.contains(btn)) return;
                const i = parseInt(btn.dataset.index, 10);
                if (!Number.isNaN(i)) goTo(i);
            });

            // après avoir défini gallery + track + thumbs :
            mountDots();


            let index = 0;
            function keepActiveThumbVisible() {
                const container = thumbs;
                const active = container?.querySelector('button.active');
                if (!container || !active) return;

                // centre la miniature active dans le viewport
                const containerRect = container.getBoundingClientRect();
                const activeRect = active.getBoundingClientRect();

                // distance entre le centre du bouton et le centre du container (en px)
                const delta = (activeRect.left + activeRect.width / 2) - (containerRect.left + containerRect.width / 2);

                // on scroll de cette distance (smooth déjà dans ton CSS, mais on le force ici aussi)
                container.scrollBy({ left: delta, behavior: 'smooth' });
            }
            function updateCarousel() {
                if (track) track.style.transform = `translateX(-${index * 100}%)`;
                dots?.querySelectorAll('.carousel-dot').forEach((b, i) => b.classList.toggle('active', i === index));
                thumbs?.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === index));
                keepActiveThumbVisible();
                updateDotsWindow(); // <= AJOUT : slide + centrage du dot actif

            }
            window.addEventListener('resize', () => updateDotsWindow());

            function goTo(i) { index = (i + gallery.length) % gallery.length; updateCarousel(); }
            dots?.addEventListener('click', (e) => {
                const i = [...dots.children].indexOf(e.target.closest('.carousel-dot'));
                if (i >= 0) goTo(i);
            });
            thumbs?.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-index]');
                if (btn) goTo(parseInt(btn.dataset.index, 10));
            });
            updateCarousel();

            // =========================
            // MOBILE: ouvrir un "carousel sheet" (pas une lightbox) au clic sur image
            // =========================
            function isMobile() {
                return window.matchMedia("(max-width: 768px)").matches;
            }

            function ensureCarouselSheet() {
                let overlay = document.querySelector(".carousel-sheet-overlay");
                if (overlay) return overlay;

                overlay = document.createElement("div");
                overlay.className = "carousel-sheet-overlay";
                overlay.innerHTML = `
    <div class="carousel-sheet" role="dialog" aria-modal="true" aria-label="Galerie">
      <div class="carousel-sheet-header">
        <button class="carousel-sheet-close" type="button" aria-label="Fermer">×</button>
      </div>
      <div class="carousel-sheet-body"></div>
    </div>
  `;

                // fermeture si clic sur le voile (mais pas dans la sheet)
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) closeCarouselSheet();
                });

                // bouton close
                overlay.querySelector(".carousel-sheet-close").addEventListener("click", closeCarouselSheet);

                document.body.appendChild(overlay);
                return overlay;
            }

            function buildSheetContent(overlay, startIndex = 0) {
                const body = overlay.querySelector(".carousel-sheet-body");
                if (!body) return;

                // on réordonne pour commencer par l’image cliquée (optionnel mais souvent agréable)
                const ordered = gallery.length
                    ? gallery.slice(startIndex).concat(gallery.slice(0, startIndex))
                    : [];

                // lignes alternées: 1 image, puis 2 images, puis 1, puis 2...
                const rows = [];
                let i = 0;
                let one = true;
                while (i < ordered.length) {
                    if (one) {
                        rows.push({ type: "one", imgs: [ordered[i]] });
                        i += 1;
                    } else {
                        rows.push({ type: "two", imgs: [ordered[i], ordered[i + 1]].filter(Boolean) });
                        i += 2;
                    }
                    one = !one;
                }

                body.innerHTML = rows.map(r => `
    <div class="carousel-sheet-row ${r.type}">
      ${r.imgs.map(g => `<img src="${g.src}" alt="${title}">`).join("")}
    </div>
  `).join("");
            }

            function openCarouselSheet(startIndex) {
                const overlay = ensureCarouselSheet();
                buildSheetContent(overlay, startIndex);

                document.body.style.overflow = "hidden";
                requestAnimationFrame(() => overlay.classList.add("is-open"));
            }

            function closeCarouselSheet() {
                const overlay = document.querySelector(".carousel-sheet-overlay");
                if (!overlay) return;

                overlay.classList.remove("is-open");

                // attendre la fin de l’anim pour éviter “cut”
                setTimeout(() => {
                    document.body.style.overflow = "";
                }, 300);
            }

            // =========================
            // Bouton "See all" => ouvre le carousel sheet (mobile + desktop)
            // =========================
            const seeAllBtn = document.querySelector(".carousel-see-all");
            seeAllBtn?.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                // ouvre sur l'image actuellement affichée dans le carousel
                openCarouselSheet(index || 0);
            });

            track?.addEventListener("click", (e) => {
                const slide = e.target.closest(".carousel-slide");
                if (!slide) return;

                openCarouselSheet(Number(slide.dataset.index));
            });


            // ----- [E] Système d’onglets (lazy-hydrate, un seul visible) -----
            const tabsBar = document.getElementById('asideTabs');
            const t = (k) => (window.translations?.[window.currentLang || 'en']?.[k] || k);


            // Création bouton d’onglet
            const mkBtn = (id, key) => {
                const b = document.createElement('button');
                b.id = `tabbtn-${id}`;
                b.setAttribute('role', 'tab');
                b.setAttribute('aria-controls', `tab-${id}`);
                b.setAttribute('data-key', key); // important pour la traduction
                return b;
            };

            // Enregistreurs d’hydratation (une fois par panneau)
            const hydrated = new Set();
            const hydrators = {
                ref: () => {
                    const refImgEl = document.getElementById('ref-img');
                    const metaGrid = document.getElementById('meta-grid');
                    if (refImgEl) {
                        refImgEl.src = d.images.reference;
                        refImgEl.alt = `${title} — référence`;
                    }
                    const rows = [];
                    if (d.locations) rows.push({ icon: 'bx bx-map', key: 'ref_location', val: d.locations });
                    if (p.movie) rows.push({ icon: 'bx bx-film', key: 'ref_movie', val: p.movie });
                    if (d.characters) rows.push({ icon: 'bx bx-user', key: 'ref_characters', val: d.characters });
                    if (metaGrid) {
                        metaGrid.innerHTML = rows.map(r => `
  <div class="meta-row">
    <i class="${r.icon}"></i>
    <span class="meta-key" data-key="${r.key}"></span>
    <span>${r.val || '-'}</span>
  </div>
`).join('');
                    }
                },
                "3d": () => {
                    const panel = document.getElementById('tab-3d');
                    const mount = () => window.Brick3D?.mount({
                        url: d.model3d,
                        container: document.getElementById('brick3d-canvas'),
                        message: document.getElementById('brick3d-message'),
                        toggle: document.getElementById('brick3d-outlines'),
                        reset: document.getElementById('brick3d-reset')
                    });
                    if (window.Brick3D) mount();
                    else window.addEventListener('brick3d-ready', mount, { once: true });
                },
                video: () => {
                    const v = document.getElementById('video-iframe');
                    if (v) v.src = d.video;
                },
                notice: () => {
                    const noticePdf = d.instructions || data.instructions || d.link || data.link || '';
                    const noticeTab = document.getElementById('tab-notice');

                    const isMobile = window.matchMedia("(max-width: 768px)").matches;

                    let viewer = document.getElementById('notice-viewer');
                    let frame = document.getElementById('notice-iframe');

                    // Zone “mobile button” (créée si besoin)
                    let mobileBox = document.getElementById('notice-mobile');
                    if (!mobileBox && noticeTab) {
                        mobileBox = document.createElement('div');
                        mobileBox.id = 'notice-mobile';
                        mobileBox.className = 'notice-mobile';
                        noticeTab.appendChild(mobileBox);
                    }

                    // Sécurité : si pas de PDF, on cache tout
                    if (!noticePdf) {
                        if (viewer) viewer.hidden = true;
                        if (mobileBox) mobileBox.hidden = true;
                        return;
                    }

                    if (isMobile) {
                        // ✅ MOBILE : pas d’iframe (sinon rendu “Ouvrir” moche)
                        if (viewer) viewer.hidden = true;

                        if (mobileBox) {
                            mobileBox.hidden = false;
                            mobileBox.innerHTML = `
        <a class="btn-primary notice-open" href="${noticePdf}" target="_blank" rel="noopener noreferrer" data-key="openNoticePdf">
          Ouvrir la notice (PDF)
        </a>
      `;
                        }
                    } else {
                        // ✅ DESKTOP : iframe OK
                        if (mobileBox) mobileBox.hidden = true;

                        // Si l’iframe n’existe pas (fallback)
                        if (!viewer && noticeTab) {
                            viewer = document.createElement('div');
                            viewer.id = 'notice-viewer';
                            viewer.className = 'pdf-viewer';
                            viewer.hidden = true;

                            frame = document.createElement('iframe');
                            frame.id = 'notice-iframe';
                            frame.title = 'Notice PDF';
                            frame.setAttribute('loading', 'lazy');

                            viewer.appendChild(frame);
                            noticeTab.appendChild(viewer);
                        }

                        if (frame && viewer) {
                            frame.src = `${noticePdf}#view=FitH`;
                            viewer.hidden = false;
                        }
                    }
                }

            };

            // Affiche un seul panneau, hydrate si nécessaire
            const showTab = (idToShow) => {
                // Cache tous les panneaux
                document.querySelectorAll('.tabpanel').forEach(p => { p.hidden = true; });
                // Active le bouton sélectionné
                document.querySelectorAll('.tabs [role="tab"]').forEach(btn => {
                    const on = btn.id === `tabbtn-${idToShow}`;
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                    btn.tabIndex = on ? 0 : -1;
                });
                // Hydrate au premier affichage
                if (!hydrated.has(idToShow)) {
                    hydrators[idToShow]?.();
                    hydrated.add(idToShow);
                }
                // Affiche uniquement le panneau demandé
                const panel = document.getElementById(`tab-${idToShow}`);
                if (panel) panel.hidden = false;
            };

            // Détection des panneaux disponibles
            const hasRef = Boolean(d?.images?.reference);
            const hasVideo = typeof d?.video === 'string' && d.video.trim() !== '';
            const has3D = typeof d?.model3d === 'string' && d.model3d.trim() !== '';
            const hasNotice = Boolean(d?.images?.notice || d?.instructions || data?.instructions || data?.link || d?.link);

            const wanted = [];
            if (hasRef) wanted.push({ id: 'ref', key: 'tab_ref' });
            if (has3D) wanted.push({ id: '3d', key: 'tab_3d' });
            if (hasVideo) wanted.push({ id: 'video', key: 'tab_video' });
            if (hasNotice) wanted.push({ id: 'notice', key: 'tab_notice' });


            // Si aucun panneau : on retire l’aside et on étend la galerie
            if (wanted.length === 0) {
                const aside = document.querySelector('.project-aside');
                const hero = document.querySelector('.project-hero');
                aside?.remove();
                hero?.classList.add('no-meta');
                return;
            }

            // Prépare l’état initial (tous cachés par défaut via hidden dans le HTML)
            document.querySelectorAll('.tabpanel').forEach(p => p.hidden = true);

            // Barre d’onglets (un seul visible à la fois)
            if (wanted.length === 1) {
                document.querySelector('.tabs').style.display = 'none';
                showTab(wanted[0].id);
            } else {
                tabsBar.innerHTML = '';
                wanted.forEach((w, i) => {
                    const btn = mkBtn(w.id, w.key);
                    btn.addEventListener('click', () => showTab(w.id));
                    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
                    btn.tabIndex = i === 0 ? 0 : -1;
                    tabsBar.appendChild(btn);
                });
                showTab(wanted[0].id); // ← n’affiche que le premier
            }
        })();
    </script>

    <!-- Three.js + modules complémentaires, tous fixés à la même version. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <!-- Copies embarquees des deux GLB pour utilisation hors serveur (file://). -->
    <script src="js/3d-assets/petronas-embedded.js"></script>
    <script src="js/3d-assets/wakanda-embedded.js"></script>
    <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// La génération des contours est faite sur le site : aucun GLB à modifier.
// Les lignes correspondent aux arêtes franches et aux limites de pièces non soudées.
const instances = new WeakMap();

function mount({ url, container, message, toggle, reset }) {
  if (!url || !container || instances.has(container)) return;
  const state = { url, outlines: [], loaded: false };
  instances.set(container, state);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (error) {
    message.textContent = 'WebGL n’est pas disponible sur ce navigateur.';
    return;
  }
  renderer.setClearColor(0xffffff, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbababa, 2.35));
  const light = new THREE.DirectionalLight(0xffffff, 2.15);
  light.position.set(4, 8, 7);
  scene.add(light);
  const light2 = new THREE.DirectionalLight(0xffffff, 0.9);
  light2.position.set(-5, 3, -4);
  scene.add(light2);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 10000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.screenSpacePanning = true;
  controls.minDistance = 0.01;
  controls.maxDistance = 10000;
  controls.autoRotate = false;

  let model = null;
  // Contours standard Three.js : plus legers et compatibles avec les gros GLB.
  const outlineMaterial = new THREE.LineBasicMaterial({
    color: 0x111111, transparent: false, depthTest: true, depthWrite: false
  });

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  const observer = new ResizeObserver(resize);
  observer.observe(container);
  resize();

  function fitView() {
    if (!model) return;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.length() / 2, 0.001);
    const halfFov = THREE.MathUtils.degToRad(camera.fov) / 2;
    const horizontalHalfFov = Math.atan(Math.tan(halfFov) * Math.max(camera.aspect, 0.1));
    const distance = radius / Math.sin(Math.min(halfFov, horizontalHalfFov)) * 1.2;
    camera.near = Math.max(distance / 1000, 0.00001);
    camera.far = distance * 1000;
    camera.updateProjectionMatrix();
    camera.position.copy(center).add(new THREE.Vector3(distance * 0.8, distance * 0.55, distance));
    controls.target.copy(center);
    controls.minDistance = Math.max(radius * 0.1, 0.001);
    controls.maxDistance = distance * 10;
    controls.update();
  }

  if (reset) reset.addEventListener('click', fitView);
  if (toggle) toggle.addEventListener('change', () => {
    for (const line of state.outlines) line.visible = toggle.checked;
  });

  // Rendu uniquement si l'onglet 3D est visible, pour préserver les ressources.
  let frame = null;
  function render() {
    frame = requestAnimationFrame(render);
    if (!container.getClientRects().length) return;
    controls.update();
    renderer.render(scene, camera);
  }
  render();

  const loader = new GLTFLoader();
  let objectUrl = null;
  let modelUrl = url;
  if (location.protocol === 'file:') {
    const filename = decodeURIComponent(url.split('/').pop().split('?')[0]).toLowerCase();
    const encoded = window.Brick3DEmbedded?.[filename];
    if (encoded) {
      const binary = atob(encoded);
      const buffer = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
      objectUrl = URL.createObjectURL(new Blob([buffer], { type: 'model/gltf-binary' }));
      modelUrl = objectUrl;
    }
  }
  loader.load(modelUrl, (gltf) => {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    model = gltf.scene;
    model.updateMatrixWorld(true);
    scene.add(model);
    // Chaque primitive du GLB conserve ses matériaux, couleurs et textures.
    // Collecter avant d'ajouter les contours (ne pas modifier l'arbre pendant traverse).
    const meshes = [];
    model.traverse((object) => {
      if (object.isMesh && object.geometry) meshes.push(object);
    });
    for (const object of meshes) {
      try {
        const edges = new THREE.EdgesGeometry(object.geometry, 32);
        if (!edges.attributes.position || edges.attributes.position.count === 0) {
          edges.dispose();
          continue;
        }
        const outlines = new THREE.LineSegments(edges, outlineMaterial);
        outlines.name = 'Brick outlines';
        outlines.frustumCulled = false;
        outlines.renderOrder = 1;
        outlines.visible = toggle ? toggle.checked : true;
        object.add(outlines);
        state.outlines.push(outlines);
      } catch (outlineError) {
        console.warn('Contours non generes pour une piece; modele conserve :', outlineError);
      }
    }
    resize();
    fitView();
    state.loaded = true;
    message.hidden = true;
  }, undefined, (error) => {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    console.error('GLB loading error:', error);
    message.textContent = 'Erreur de chargement 3D : ' + (error?.message || String(error)) + '. Consulte la console (F12).';
  });
}

window.Brick3D = { mount };
window.dispatchEvent(new Event('brick3d-ready'));

</script>

    <script>
        (function () {
            const sel = {
                header: '.header',                                   // adapte si besoin
                title: '.main-content .title',
                sep: '.main-content .separator',
                wrap: '.hero-scale-wrap',
                hero: '.hero-scale-wrap .project-hero'
            };

            function measureOffset() {
                const h = document.querySelector(sel.header)?.offsetHeight || 0;
                const t = document.querySelector(sel.title)?.offsetHeight || 0;
                const s = document.querySelector(sel.sep)?.offsetHeight || 0;
                return h + t + s + 12;   // petite marge de confort
            }

            function fitHero() {
                const wrap = document.querySelector(sel.wrap);
                const hero = document.querySelector(sel.hero);
                if (!wrap || !hero) return;

                // Désactiver l’échelle si on est déjà en 1 colonne (CSS @media)
                const twoCols = window.matchMedia('(min-width:1064px)').matches;
                if (!twoCols) {
                    hero.style.transform = '';
                    wrap.style.height = '';
                    wrap.classList.remove('fit');
                    return;
                }

                // tailles naturelles (non-scalées)
                hero.style.transform = 'none';
                wrap.style.height = 'auto';

                const offsetTop = measureOffset();
                const availH = Math.max(0, window.innerHeight - offsetTop);
                const availW = document.documentElement.clientWidth; // largeur viewport

                const naturalH = hero.offsetHeight;
                const naturalW = hero.offsetWidth;

                // marges latérales déjà gérées par .project-page (5–10%) :contentReference[oaicite:3]{index=3}
                const scaleH = availH > 0 ? (availH / naturalH) : 1;
                const scaleW = availW > 0 ? (availW / naturalW) : 1;

                const s = Math.min(scaleH, scaleW, 1);  // ≤ 1, jamais d’agrandissement

                if (s < 1) {
                    hero.style.transform = `scale(${s})`;
                    // Réserver la bonne hauteur dans le flux pour que ce soit cliquable partout
                    wrap.style.height = `${availH}px`; // au lieu de naturalH * s
                    wrap.classList.add('fit');
                } else {
                    hero.style.transform = '';
                    wrap.style.height = '';
                    wrap.classList.remove('fit');
                }
            }


            window.addEventListener('load', fitHero, { once: true });
            window.addEventListener('resize', fitHero);
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const hero = document.querySelector(".project-hero");
            const aside = hero?.querySelector(".project-aside");

            if (!aside || aside.children.length === 0) {
                hero.classList.add("no-aside");
            }
        });
    </script>
